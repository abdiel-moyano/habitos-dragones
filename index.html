  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Silkscreen';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"44692760-4bf1-4280-b9a9-d54c80136ea1\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Silkscreen';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"1390c9d2-77b8-4037-86a0-f16d329c06eb\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Silkscreen';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"5ecf85ad-12fb-40dd-933f-756833e356c4\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Silkscreen';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"bef6cd9f-6588-4e9e-a229-564e58f4085e\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'VT323';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"5964536c-1a82-4d26-8b57-b88554e2cbc7\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'VT323';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"cf320bd2-afc2-41e3-8a5e-6c0997015501\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'VT323';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"eb7a081c-2f92-439c-9792-8c3fa920dce8\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n/* ============================================================\n   HÁBITOS & DRAGONES — Tracker RPG\n   Paleta NES limitada · marcos pixelados · sin radius\n   ============================================================ */\n:root{\n  --bg:        #0e0e1f;\n  --bg2:       #1a1a2e;\n  --panel:     #16213e;\n  --panel-2:   #1e2a4a;\n  --dialog:    #0c2461;\n  --ink:       #f4e4bc;\n  --ink-dim:   #b9a98a;\n  --white:     #ffffff;\n  --black:     #000000;\n  --gold:      #ffd700;\n  --gold-2:    #c9a227;\n  --hp:        #e63946;\n  --hp-dim:    #7a1c25;\n  --xp:        #06ffa5;\n  --xp-dim:    #066d49;\n  --mp:        #4361ee;\n  --mp-dim:    #1e2a73;\n  --purple:    #7209b7;\n  --purple-2:  #b56cf0;\n  --warn:      #ff7b00;\n  --pink:      #ff5d8f;\n}\n\n*{box-sizing:border-box; image-rendering:pixelated; image-rendering:-moz-crisp-edges;}\nhtml,body{margin:0; padding:0; min-height:100%;}\n\nbody{\n  font-family:'VT323',monospace;\n  font-size:22px; line-height:1.15;\n  color:var(--ink);\n  background:\n    /* estrella sutil */\n    url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 64 64'><rect x='7' y='13' width='2' height='2' fill='%23ffffff' opacity='0.35'/><rect x='42' y='5' width='2' height='2' fill='%23ffd700' opacity='0.45'/><rect x='27' y='38' width='2' height='2' fill='%23ffffff' opacity='0.25'/><rect x='55' y='49' width='2' height='2' fill='%2306ffa5' opacity='0.35'/><rect x='13' y='52' width='2' height='2' fill='%23ffffff' opacity='0.3'/><\u002Fsvg>\"),\n    /* grid mazmorra */\n    url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16'><path d='M0 15h16M15 0v16' stroke='%23ffffff' stroke-opacity='0.04'/><\u002Fsvg>\"),\n    linear-gradient(180deg,#0b0b1c 0%, #16213e 100%);\n  background-attachment: fixed, fixed, fixed;\n  min-height:100vh;\n  letter-spacing:.5px;\n  -webkit-font-smoothing:none;\n  font-smooth:never;\n}\n\n/* ---------- Tipografía RPG ---------- */\n.ps{font-family:'Press Start 2P',monospace; letter-spacing:1px; line-height:1.4;}\n.silk{font-family:'Silkscreen',monospace; letter-spacing:.5px;}\n.vt{font-family:'VT323',monospace;}\n\nh1,h2,h3,h4{font-family:'Press Start 2P',monospace; font-weight:normal; margin:0; letter-spacing:1px;}\nh1{font-size:22px;}\nh2{font-size:14px;}\nh3{font-size:11px;}\n\nbutton{font-family:inherit; font-size:inherit; color:inherit; cursor:pointer;}\n\n/* ---------- Sombras y marcos pixelados (estilo NES) ---------- */\n/* Marco doble: borde negro exterior + crema interior + sombra dura */\n.frame{\n  position:relative;\n  background:var(--panel);\n  color:var(--ink);\n  border:3px solid var(--black);\n  box-shadow:\n    inset 0 0 0 3px var(--ink),\n    inset 0 0 0 6px var(--black),\n    4px 4px 0 var(--black);\n  padding:18px 16px 16px;\n}\n.frame--dialog{background:var(--dialog); }\n.frame--gold{\n  background:linear-gradient(180deg,#3a2a08, #1c1405);\n  box-shadow:\n    inset 0 0 0 3px var(--gold),\n    inset 0 0 0 6px var(--black),\n    4px 4px 0 var(--black);\n}\n.frame--shop{ background:#3a1f0e;\n  box-shadow:\n    inset 0 0 0 3px #e8a04a,\n    inset 0 0 0 6px var(--black),\n    4px 4px 0 var(--black);\n}\n.frame--admin{ background:#2a0e1a;\n  box-shadow:\n    inset 0 0 0 3px #ff5d8f,\n    inset 0 0 0 6px var(--black),\n    4px 4px 0 var(--black);\n}\n.frame--quest{ background:#101a30; padding:10px 12px;}\n.frame--small{padding:10px 12px;}\n\n/* Esquinas \"rivet\" pixel */\n.frame::before,.frame::after{\n  content:\"\"; position:absolute; width:6px; height:6px; background:var(--ink); pointer-events:none;\n}\n.frame::before{ top:3px; left:3px; box-shadow: calc(100% + 0px) 0 0 var(--ink); }\n.frame::after{ bottom:3px; left:3px; box-shadow: calc(100% + 0px) 0 0 var(--ink); }\n\n/* ---------- Botón retro ---------- */\n.btn{\n  display:inline-flex; align-items:center; justify-content:center; gap:8px;\n  font-family:'Press Start 2P',monospace; font-size:10px; letter-spacing:1px;\n  padding:12px 14px;\n  background:var(--panel-2); color:var(--ink);\n  border:3px solid var(--black);\n  box-shadow: inset 0 0 0 2px var(--ink), 4px 4px 0 var(--black);\n  text-transform:uppercase;\n  transition: transform .05s linear, box-shadow .05s linear;\n  user-select:none;\n  min-height:44px;\n}\n.btn:hover{ filter:brightness(1.08); }\n.btn:active{ transform: translate(4px,4px); box-shadow: inset 0 0 0 2px var(--ink), 0 0 0 var(--black); }\n.btn[disabled]{ filter:grayscale(.8) brightness(.6); cursor:not-allowed; }\n.btn--gold{ background:linear-gradient(180deg,#7d5a10,#3a2a08); color:var(--gold); box-shadow: inset 0 0 0 2px var(--gold), 4px 4px 0 var(--black); }\n.btn--xp{ background:linear-gradient(180deg,#0b6e4a,#03392a); color:var(--xp); box-shadow: inset 0 0 0 2px var(--xp), 4px 4px 0 var(--black);}\n.btn--hp{ background:linear-gradient(180deg,#7a1c25,#3a0d12); color:#ffd0d4; box-shadow: inset 0 0 0 2px var(--hp), 4px 4px 0 var(--black);}\n.btn--mp{ background:linear-gradient(180deg,#1f2b78,#0b1240); color:#cfd7ff; box-shadow: inset 0 0 0 2px var(--mp), 4px 4px 0 var(--black);}\n.btn--ghost{ background:transparent; box-shadow: inset 0 0 0 2px var(--ink-dim), 4px 4px 0 var(--black);}\n.btn--sm{ font-size:8px; padding:8px 10px; min-height:36px;}\n.btn--xs{ font-size:7px; padding:6px 8px; min-height:30px; box-shadow: inset 0 0 0 2px var(--ink), 2px 2px 0 var(--black);}\n.btn--xs:active{ transform:translate(2px,2px); box-shadow: inset 0 0 0 2px var(--ink), 0 0 0 var(--black);}\n.btn--block{ width:100%;}\n\n/* ---------- Tile (icono pixel) ---------- */\n.tile{\n  display:inline-grid; place-items:center;\n  width:44px; height:44px;\n  background:#22305a;\n  border:2px solid var(--black);\n  box-shadow: inset 0 0 0 2px var(--ink), 2px 2px 0 var(--black);\n  font-size:24px;\n  flex-shrink:0;\n}\n.tile--lg{width:64px; height:64px; font-size:34px;}\n.tile--xl{width:96px; height:96px; font-size:54px;}\n.tile--gold{ background:#3a2a08; box-shadow: inset 0 0 0 2px var(--gold), 2px 2px 0 var(--black);}\n.tile--hp{ background:#3a0d12; box-shadow: inset 0 0 0 2px var(--hp), 2px 2px 0 var(--black);}\n.tile--xp{ background:#03392a; box-shadow: inset 0 0 0 2px var(--xp), 2px 2px 0 var(--black);}\n.tile--mp{ background:#0b1240; box-shadow: inset 0 0 0 2px var(--mp), 2px 2px 0 var(--black);}\n.tile--purple{ background:#2a0844; box-shadow: inset 0 0 0 2px var(--purple-2), 2px 2px 0 var(--black);}\n\n/* ---------- Barras tipo HP segmentadas ---------- */\n.bar{\n  position:relative;\n  height:22px;\n  background:#0a0f1f;\n  border:2px solid var(--black);\n  box-shadow: inset 0 0 0 2px var(--ink);\n  overflow:hidden;\n}\n.bar__fill{\n  height:100%;\n  background:\n    repeating-linear-gradient(90deg, transparent 0 11px, rgba(0,0,0,.25) 11px 12px),\n    linear-gradient(180deg, var(--xp), var(--xp-dim));\n  transition: width .4s steps(20);\n}\n.bar__fill--hp{ background:\n    repeating-linear-gradient(90deg, transparent 0 11px, rgba(0,0,0,.25) 11px 12px),\n    linear-gradient(180deg, #ff8088, var(--hp));}\n.bar__fill--mp{ background:\n    repeating-linear-gradient(90deg, transparent 0 11px, rgba(0,0,0,.25) 11px 12px),\n    linear-gradient(180deg, #7aa0ff, var(--mp));}\n.bar__fill--gold{ background:\n    repeating-linear-gradient(90deg, transparent 0 11px, rgba(0,0,0,.25) 11px 12px),\n    linear-gradient(180deg, #fff1a0, var(--gold));}\n.bar__txt{\n  position:absolute; inset:0;\n  display:flex; align-items:center; justify-content:center;\n  font-family:'Press Start 2P',monospace; font-size:10px;\n  color:var(--white); text-shadow: 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000;\n  letter-spacing:1px;\n}\n\n/* ---------- Layout app ---------- */\n.app{\n  max-width:1240px; margin:0 auto; padding:18px 14px 120px;\n}\n\n.topbar{\n  display:flex; align-items:center; justify-content:space-between; gap:14px;\n  margin-bottom:18px;\n}\n.brand{\n  display:flex; align-items:center; gap:14px;\n}\n.brand__logo{\n  width:48px; height:48px; display:grid; place-items:center;\n  background:#0c2461;\n  border:3px solid #000;\n  box-shadow: inset 0 0 0 2px var(--gold), 3px 3px 0 #000;\n  font-size:28px;\n}\n.brand__title{ color:var(--gold); font-size:18px;}\n.brand__sub{ font-family:'Silkscreen',monospace; color:var(--ink-dim); font-size:11px; margin-top:4px;}\n\n.topbar__date{\n  font-family:'Press Start 2P',monospace; font-size:9px; color:var(--ink-dim);\n  text-align:right;\n}\n.topbar__date strong{color:var(--xp);}\n\n/* Selector party */\n.party{\n  display:grid; grid-template-columns: repeat(3, 1fr); gap:12px;\n  margin-bottom:18px;\n}\n.party__btn{\n  display:flex; align-items:center; gap:12px; padding:12px;\n  background:var(--panel);\n  border:3px solid var(--black);\n  box-shadow: inset 0 0 0 2px var(--ink-dim), 4px 4px 0 var(--black);\n  cursor:pointer; color:var(--ink); text-align:left;\n  transition:transform .05s;\n  min-height:80px;\n}\n.party__btn:active{ transform:translate(2px,2px); }\n.party__btn.is-active{\n  box-shadow: inset 0 0 0 2px var(--gold), 4px 4px 0 var(--black);\n  background: linear-gradient(180deg,#1f2a4f, #16213e);\n  animation: goldBlink 1.4s steps(2) infinite;\n}\n@keyframes goldBlink{\n  0%, 60%{ box-shadow: inset 0 0 0 2px var(--gold), 4px 4px 0 var(--black);}\n  61%, 100%{ box-shadow: inset 0 0 0 2px #fff8c0, 4px 4px 0 var(--black);}\n}\n.party__name{ font-family:'Press Start 2P',monospace; font-size:11px; color:var(--gold); }\n.party__role{ color:var(--ink-dim); font-size:18px; }\n\n/* Grid principal */\n.main-grid{\n  display:grid; grid-template-columns: 1.05fr 1fr;\n  gap:18px;\n}\n@media (max-width:880px){\n  .main-grid{ grid-template-columns: 1fr;}\n  .party{ grid-template-columns: 1fr 1fr; }\n}\n\n.stack{display:flex; flex-direction:column; gap:18px;}\n\n/* Stats grid */\n.stats{\n  display:grid; grid-template-columns: repeat(4, 1fr); gap:10px;\n  margin-bottom:14px;\n}\n.stat{\n  background:var(--panel-2);\n  border:2px solid var(--black);\n  box-shadow: inset 0 0 0 2px var(--ink-dim), 2px 2px 0 var(--black);\n  padding:8px;\n  text-align:center;\n  display:flex; flex-direction:column; align-items:center; gap:4px;\n  min-height:80px; justify-content:center;\n}\n.stat__label{ font-family:'Press Start 2P',monospace; font-size:7px; color:var(--ink-dim);}\n.stat__value{ font-family:'Press Start 2P',monospace; font-size:14px; color:var(--gold);}\n.stat--hp .stat__value{color:var(--hp);}\n.stat--xp .stat__value{color:var(--xp);}\n.stat--mp .stat__value{color:var(--mp);}\n.stat__icon{font-size:22px;}\n\n/* Llama animada */\n.flame{ display:inline-block; animation: flame 0.6s steps(3) infinite;}\n@keyframes flame{\n  0%{ transform: translateY(0) scale(1);}\n  50%{ transform: translateY(-2px) scale(1.06);}\n  100%{ transform: translateY(0) scale(1);}\n}\n.coin-spin{ display:inline-block; animation: spin 1.6s steps(6) infinite;}\n@keyframes spin{\n  0%{ transform: scaleX(1);}\n  50%{ transform: scaleX(.2);}\n  100%{ transform: scaleX(1);}\n}\n\n/* Mascota Pokédex */\n.pet{\n  display:grid; grid-template-columns: 120px 1fr; gap:14px;\n  align-items:stretch;\n}\n.pet__cage{\n  background:\n    repeating-linear-gradient(0deg, rgba(255,255,255,.04) 0 2px, transparent 2px 8px),\n    radial-gradient(circle at 50% 60%, #2a3a78 0%, #0c1530 70%);\n  border:3px solid var(--black);\n  box-shadow: inset 0 0 0 2px var(--ink), 3px 3px 0 var(--black);\n  display:grid; place-items:center;\n  min-height:140px; position:relative;\n  overflow:hidden;\n}\n.pet__sprite-canvas{\n  width:108px; height:118px; image-rendering:pixelated;\n  animation: breathe 2.2s ease-in-out infinite;\n  filter: drop-shadow(2px 3px 0 rgba(0,0,0,.5));\n}\n@keyframes breathe{\n  0%,100%{ transform: scale(1);}\n  50%{ transform: scale(1.06);}\n}\n.pet__info{ display:flex; flex-direction:column; gap:6px; justify-content:space-between;}\n.pet__name{ font-family:'Press Start 2P',monospace; font-size:11px; color:var(--purple-2);}\n.pet__level{ font-family:'Press Start 2P',monospace; font-size:9px; color:var(--gold);}\n.pet__desc{ color:var(--ink-dim); font-size:18px; line-height:1.1;}\n\n/* Cofre sueldo */\n.treasure{\n  display:flex; align-items:center; gap:14px;\n}\n.treasure__icon{ font-size:48px; filter: drop-shadow(2px 2px 0 #000); }\n.treasure__amount{ font-family:'Press Start 2P',monospace; font-size:18px; color:var(--gold);}\n.treasure__sub{ color:var(--ink-dim); font-size:18px;}\n\n/* Quest list */\n.quest-group{ margin-bottom:14px;}\n.quest-group__title{\n  display:flex; align-items:center; gap:10px; margin-bottom:10px;\n  font-family:'Press Start 2P',monospace; font-size:10px;\n  color:var(--ink);\n}\n.quest-group__title::after{\n  content:\"\"; flex:1; height:0;\n  border-top:2px dashed #2c3a66;\n}\n\n.quest{\n  display:grid; grid-template-columns: 44px 1fr auto auto; gap:10px; align-items:center;\n  background:#101a30;\n  border:2px solid var(--black);\n  box-shadow: inset 0 0 0 2px var(--ink-dim), 2px 2px 0 var(--black);\n  padding:8px 10px;\n  margin-bottom:8px;\n  position:relative;\n  min-height:60px;\n}\n.quest.is-done{\n  background:#0d2a1f;\n  box-shadow: inset 0 0 0 2px var(--xp), 2px 2px 0 var(--black);\n}\n.quest.is-done .quest__name{ color:var(--xp); text-decoration:line-through; text-decoration-thickness:2px;}\n.quest.is-forgiven{ box-shadow: inset 0 0 0 2px var(--purple-2), 2px 2px 0 var(--black); background:#1a0c2e;}\n.quest.is-forgiven .quest__name{ color:var(--purple-2);}\n\n.quest__name{ font-size:20px; line-height:1.05;}\n.quest__reward{ font-family:'Press Start 2P',monospace; font-size:8px; color:var(--gold); white-space:nowrap;}\n.quest__actions{ display:flex; gap:6px;}\n\n/* Checkbox pixelado */\n.pxcheck{\n  width:36px; height:36px; display:grid; place-items:center;\n  border:2px solid var(--black);\n  box-shadow: inset 0 0 0 2px var(--ink);\n  background:#0a0f1f;\n  cursor:pointer; color:transparent;\n  font-family:'Press Start 2P',monospace; font-size:18px;\n}\n.pxcheck.is-on{ background:var(--xp-dim); color:var(--xp); }\n.pxcheck.is-forgiven{ background:#2a0844; color:var(--purple-2); box-shadow: inset 0 0 0 2px var(--purple-2);}\n\n/* Contador de agua */\n.water{\n  display:flex; gap:4px; margin-top:4px;\n}\n.water__drop{\n  width:18px; height:22px; background:#0a0f1f;\n  border:2px solid var(--black);\n  box-shadow: inset 0 0 0 1px var(--ink-dim);\n  cursor:pointer;\n  display:grid; place-items:center; color:transparent;\n  font-size:14px;\n}\n.water__drop.is-on{ background:#0b1240; color:#7aa0ff; box-shadow: inset 0 0 0 1px var(--mp); }\n\n/* Alerta hábito */\n.miss-warn{\n  display:inline-block;\n  background:#3a0d12;\n  color:#ffb0b8;\n  font-family:'Silkscreen',monospace; font-size:10px;\n  padding:3px 6px;\n  border:2px solid var(--hp);\n  margin-left:6px;\n  animation: blink 1s steps(2) infinite;\n}\n@keyframes blink{\n  0%,60%{ opacity:1;}\n  61%,100%{ opacity:.35;}\n}\n\n/* Footer nav menu pausa */\n.menubar{\n  position:fixed; left:0; right:0; bottom:0;\n  background: linear-gradient(180deg,#0c1632, #060916);\n  border-top:4px solid #000;\n  box-shadow: 0 -4px 0 var(--ink) inset;\n  padding:10px 14px env(safe-area-inset-bottom,10px);\n  z-index:30;\n}\n.menubar__inner{\n  max-width:1240px; margin:0 auto;\n  display:flex; gap:8px; justify-content:space-between; flex-wrap:wrap;\n}\n.menubar .btn{ flex:1; min-width:120px;}\n@media (max-width:600px){\n  .menubar__inner{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; justify-content:stretch;}\n  .menubar .btn{ flex-direction:column; gap:3px; font-size:7px; padding:8px 3px; min-width:0; min-height:52px; white-space:normal; line-height:1.2;}\n  .app{ padding-bottom:170px;}\n}\n\n/* ---------- Modales tipo diálogo RPG ---------- */\n.scrim{\n  position:fixed; inset:0; z-index:50;\n  background:rgba(0,0,8,.78);\n  display:none; align-items:flex-start; justify-content:center;\n  padding:24px 14px; overflow-y:auto;\n}\n.scrim.is-open{ display:flex;}\n.modal{\n  width:min(680px, 100%);\n  max-height: calc(100vh - 48px);\n  overflow-y:auto;\n  padding:22px 20px;\n}\n.modal--wide{ width:min(900px,100%); }\n.modal__title{\n  display:flex; align-items:center; justify-content:space-between; gap:12px;\n  margin-bottom:14px;\n}\n.modal__title h2{ color:var(--gold);}\n.modal__close{\n  font-family:'Press Start 2P',monospace; font-size:10px;\n  background:transparent; border:none; color:var(--ink);\n  cursor:pointer; padding:4px 8px;\n}\n.modal__close:hover{ color:var(--hp);}\n\n.dialog-text{\n  font-size:24px; line-height:1.25;\n  min-height:60px;\n}\n.dialog-cursor{\n  display:inline-block; width:14px; height:14px; background:var(--gold);\n  margin-left:4px; vertical-align:-2px;\n  animation: blink 1s steps(2) infinite;\n}\n\n/* Shop list */\n.shop-list{ display:grid; grid-template-columns: 1fr; gap:10px;}\n.shop-item{\n  display:grid; grid-template-columns: 56px 1fr auto; gap:12px; align-items:center;\n  background:#2a1808; border:2px solid var(--black);\n  box-shadow: inset 0 0 0 2px var(--gold-2), 2px 2px 0 var(--black);\n  padding:10px;\n}\n.shop-item.is-locked{ filter:grayscale(.6) brightness(.6); }\n.shop-item__name{ font-family:'Press Start 2P',monospace; font-size:10px; color:var(--gold);}\n.shop-item__desc{ color:var(--ink-dim); font-size:18px; margin-top:3px;}\n.shop-item__price{\n  font-family:'Press Start 2P',monospace; font-size:11px; color:var(--gold);\n  display:flex; align-items:center; gap:6px;\n}\n\n/* Catálogo anotaciones */\n.cat-list{ display:grid; grid-template-columns:1fr 1fr; gap:8px;}\n@media (max-width:560px){ .cat-list{grid-template-columns:1fr;} }\n.cat-item{\n  display:grid; grid-template-columns: 40px 1fr auto; gap:8px; align-items:center;\n  background:#0f1530; border:2px solid var(--black);\n  box-shadow: inset 0 0 0 2px var(--ink-dim), 2px 2px 0 var(--black);\n  padding:8px;\n  cursor:pointer; color:inherit; text-align:left;\n}\n.cat-item:hover{ box-shadow: inset 0 0 0 2px var(--gold), 2px 2px 0 var(--black);}\n.cat-item--bad{ box-shadow: inset 0 0 0 2px var(--hp-dim), 2px 2px 0 var(--black);}\n.cat-item--bad:hover{ box-shadow: inset 0 0 0 2px var(--hp), 2px 2px 0 var(--black);}\n.cat-item__name{ font-size:18px; line-height:1;}\n.cat-item__cost{ font-family:'Press Start 2P',monospace; font-size:9px;}\n.cost--bad{ color:#ff7a82;}\n.cost--good{ color:var(--xp);}\n.rep-badge{\n  display:inline-block; background:var(--hp); color:#fff;\n  font-family:'Press Start 2P',monospace; font-size:7px;\n  padding:2px 4px; margin-left:6px;\n  animation: blink 1s steps(2) infinite;\n}\n\n/* PIN input */\n.pin{\n  display:flex; gap:8px; justify-content:center; margin:14px 0;\n}\n.pin input{\n  width:48px; height:60px; text-align:center;\n  font-family:'Press Start 2P',monospace; font-size:22px;\n  background:#0a0f1f; color:var(--gold);\n  border:3px solid var(--black);\n  box-shadow: inset 0 0 0 2px var(--ink);\n  outline:none;\n}\n.pin input:focus{ box-shadow: inset 0 0 0 2px var(--gold); }\n\n/* Numpad */\n.numpad{\n  display:grid; grid-template-columns: repeat(3,1fr); gap:8px;\n  max-width:280px; margin:0 auto;\n}\n.numpad .btn{ font-size:14px; padding:14px 0;}\n\n/* Historial calendario */\n.cal{\n  display:grid; grid-template-columns: repeat(7, 1fr); gap:4px;\n}\n.cal__day{\n  aspect-ratio: 1;\n  display:grid; place-items:center;\n  background:#0f1530; border:2px solid #000;\n  font-family:'Press Start 2P',monospace; font-size:9px;\n  color:var(--ink-dim); position:relative;\n}\n.cal__day.lvl-100{ background:#066d49; color:#fff; box-shadow: inset 0 0 0 1px var(--xp);}\n.cal__day.lvl-80{ background:#0a4a37; color:var(--xp); box-shadow: inset 0 0 0 1px var(--xp);}\n.cal__day.lvl-50{ background:#7a5f0a; color:#ffe07a; box-shadow: inset 0 0 0 1px var(--gold);}\n.cal__day.lvl-25{ background:#7a3a0a; color:#ffb070; box-shadow: inset 0 0 0 1px var(--warn);}\n.cal__day.lvl-0{ background:#3a0d12; color:#ff8088; box-shadow: inset 0 0 0 1px var(--hp);}\n.cal__day.is-rest{ background:#1f1a30; color:#9b8fc0; }\n.cal__day.is-today{ box-shadow: inset 0 0 0 2px var(--gold);}\n.cal__head{\n  font-family:'Press Start 2P',monospace; font-size:8px; color:var(--gold);\n  text-align:center; padding:4px 0;\n}\n\n/* Toasts XP flotantes */\n.toasts{ position:fixed; inset:0; pointer-events:none; z-index:60;}\n.xp-toast{\n  position:absolute;\n  font-family:'Press Start 2P',monospace; font-size:14px;\n  text-shadow: 2px 2px 0 #000;\n  animation: floatUp 1.4s ease-out forwards;\n  pointer-events:none;\n}\n@keyframes floatUp{\n  0%{ transform: translateY(0) scale(.5); opacity:0;}\n  20%{ transform: translateY(-10px) scale(1); opacity:1;}\n  100%{ transform: translateY(-80px) scale(1); opacity:0;}\n}\n\n/* Confeti pixel */\n.confetti{\n  position:absolute; width:6px; height:6px;\n  animation: confetti 1.6s ease-out forwards;\n}\n@keyframes confetti{\n  0%{ transform: translate(0,0) rotate(0deg); opacity:1;}\n  100%{ transform: translate(var(--dx), var(--dy)) rotate(180deg); opacity:0;}\n}\n\n/* Level up gigante */\n.levelup{\n  position:fixed; inset:0; z-index:70;\n  background: radial-gradient(circle at 50% 50%, rgba(255,215,0,.18) 0%, rgba(0,0,0,.85) 70%);\n  display:none; align-items:center; justify-content:center; flex-direction:column;\n  gap:24px;\n}\n.levelup.is-open{ display:flex;}\n.levelup__title{\n  font-family:'Press Start 2P',monospace; font-size:48px; color:var(--gold);\n  text-shadow: 4px 4px 0 #000, -4px 4px 0 #000, 4px -4px 0 #000, -4px -4px 0 #000;\n  animation: pulse 1s steps(2) infinite;\n}\n@media (max-width:560px){ .levelup__title{ font-size:30px;}}\n@keyframes pulse{\n  0%,60%{ transform:scale(1); filter:hue-rotate(0deg);}\n  61%,100%{ transform:scale(1.05); filter:hue-rotate(20deg);}\n}\n.levelup__pet-canvas{\n  width:176px; height:192px; image-rendering:pixelated;\n  animation: shimmer 1.4s ease-in-out infinite;\n  filter: drop-shadow(0 0 8px var(--gold));\n}\n@keyframes shimmer{\n  0%,100%{ filter: drop-shadow(0 0 4px var(--gold));}\n  50%{ filter: drop-shadow(0 0 16px var(--xp));}\n}\n\n/* Section header inside modal */\n.section-h{\n  display:flex; align-items:center; gap:10px; margin:14px 0 8px;\n  font-family:'Press Start 2P',monospace; font-size:10px; color:var(--gold);\n}\n.section-h::after{ content:\"\"; flex:1; border-top:2px dashed #2c3a66;}\n\n/* Kid columns admin */\n.kid-col{\n  display:grid; grid-template-columns: 1fr 1fr; gap:14px;\n}\n@media (max-width:780px){ .kid-col{ grid-template-columns:1fr;}}\n\n/* Selector grilla acciones admin */\n.admin-actions{\n  display:grid; grid-template-columns: 1fr 1fr; gap:6px; margin-top:8px;\n}\n.payout-row{\n  display:grid; grid-template-columns: 1fr auto auto; gap:8px; align-items:center;\n  background:#101a30; border:2px solid #000; padding:8px 10px;\n  margin-top:6px;\n  box-shadow: inset 0 0 0 1px var(--ink-dim);\n}\n.payout-row__name{ font-size:18px;}\n.payout-row__amt{ font-family:'Press Start 2P',monospace; font-size:10px; color:var(--gold);}\n\n/* Day picker (edit past) */\n.daylist{\n  display:grid; grid-template-columns: repeat(2,1fr); gap:6px; max-height:240px; overflow:auto;\n}\n.day-btn{\n  background:#0f1530; border:2px solid #000;\n  box-shadow: inset 0 0 0 2px var(--ink-dim), 2px 2px 0 #000;\n  padding:8px; text-align:left; cursor:pointer; color:inherit;\n  font-size:18px;\n}\n.day-btn small{ font-family:'Press Start 2P',monospace; font-size:8px; color:var(--gold); display:block; margin-top:3px;}\n\n/* Tag */\n.tag{\n  display:inline-block; font-family:'Press Start 2P',monospace; font-size:7px;\n  padding:3px 5px; border:2px solid #000;\n  background:#0f1530;\n  box-shadow: inset 0 0 0 1px var(--ink-dim);\n  margin-left:4px;\n}\n.tag--ok{ background:#0a4a37; color:var(--xp); box-shadow: inset 0 0 0 1px var(--xp);}\n.tag--bad{ background:#3a0d12; color:#ff8088; box-shadow: inset 0 0 0 1px var(--hp);}\n.tag--gold{ background:#3a2a08; color:var(--gold); box-shadow: inset 0 0 0 1px var(--gold);}\n.tag--mp{ background:#0b1240; color:#cfd7ff; box-shadow: inset 0 0 0 1px var(--mp);}\n\n/* Form */\ninput[type=\"text\"], input[type=\"number\"], input[type=\"date\"], select{\n  font-family:'VT323',monospace; font-size:20px;\n  padding:8px 10px;\n  background:#0a0f1f; color:var(--ink);\n  border:2px solid var(--black);\n  box-shadow: inset 0 0 0 2px var(--ink-dim);\n  outline:none; width:100%;\n}\ninput:focus, select:focus{ box-shadow: inset 0 0 0 2px var(--gold);}\nlabel{ font-family:'Press Start 2P',monospace; font-size:8px; color:var(--ink-dim); display:block; margin:8px 0 4px;}\n\ntextarea{\n  font-family:'VT323',monospace; font-size:18px;\n  width:100%; min-height:60px;\n  background:#0a0f1f; color:var(--ink);\n  border:2px solid var(--black); padding:8px;\n  box-shadow: inset 0 0 0 2px var(--ink-dim);\n}\n\n/* Daily summary block */\n.summary{\n  background:#101a30; border:2px solid #000;\n  box-shadow: inset 0 0 0 2px var(--ink-dim), 2px 2px 0 #000;\n  padding:10px 12px;\n  display:flex; justify-content:space-between; align-items:center; gap:12px;\n  flex-wrap:wrap;\n}\n\n/* small util */\n.row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap;}\n.row--between{ justify-content:space-between;}\n.muted{ color:var(--ink-dim);}\n.gold{ color:var(--gold);}\n.xp{ color:var(--xp);}\n.hp{ color:var(--hp);}\n.center{ text-align:center;}\n.mt-8{ margin-top:8px;} .mt-12{ margin-top:12px;} .mt-16{ margin-top:16px;}\n.mb-8{ margin-bottom:8px;} .mb-12{ margin-bottom:12px;}\n.divider{ height:0; border-top:2px dashed #2c3a66; margin:14px 0;}\n\n/* Avatar grande del party */\n.avatar{\n  width:64px; height:64px; display:grid; place-items:center;\n  font-size:36px;\n  background:#0c2461;\n  border:3px solid #000;\n  box-shadow: inset 0 0 0 2px var(--gold), 3px 3px 0 #000;\n}\n\n.party__btn .avatar{ width:48px; height:48px; font-size:28px; box-shadow: inset 0 0 0 2px var(--ink-dim), 3px 3px 0 #000;}\n.party__btn.is-active .avatar{ box-shadow: inset 0 0 0 2px var(--gold), 3px 3px 0 #000;}\n\n/* Page transitions */\n.fade-in{ animation: fadeIn .25s ease-out;}\n@keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}\n\n/* Hide native scrollbar a bit */\n.modal::-webkit-scrollbar{ width:10px;}\n.modal::-webkit-scrollbar-track{ background:#0a0f1f;}\n.modal::-webkit-scrollbar-thumb{ background:var(--ink-dim); border:2px solid #000;}\n\n/* Annotations entry list */\n.note-row{\n  display:flex; justify-content:space-between; align-items:center;\n  background:#0f1530; border:2px solid #000;\n  box-shadow: inset 0 0 0 1px var(--ink-dim);\n  padding:6px 10px; margin-bottom:4px;\n  font-size:18px;\n}\n.note-row small{ font-family:'Press Start 2P',monospace; font-size:8px; }\n\n/* Stat split per kid in admin */\n.kid-stat-grid{\n  display:grid; grid-template-columns: repeat(3,1fr); gap:6px; margin-top:8px;\n}\n.mini-stat{\n  background:#0f1530; border:2px solid #000;\n  box-shadow: inset 0 0 0 1px var(--ink-dim);\n  padding:6px; text-align:center;\n}\n.mini-stat__l{ font-family:'Press Start 2P',monospace; font-size:7px; color:var(--ink-dim);}\n.mini-stat__v{ font-family:'Press Start 2P',monospace; font-size:11px; color:var(--gold);}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"app\" id=\"app\">\n  <!-- Top bar -->\n  <div class=\"topbar\">\n    <div class=\"brand\">\n      <div class=\"brand__logo\">🐉<\u002Fdiv>\n      <div>\n        <div class=\"brand__title ps\">HÁBITOS &amp; DRAGONES<\u002Fdiv>\n        <div class=\"brand__sub\">Misión diaria · party de la familia<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"topbar__date\" id=\"topbarDate\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Selector party -->\n  <div class=\"party\" id=\"party\"><\u002Fdiv>\n\n  <!-- Grid principal -->\n  <div class=\"main-grid\">\n    <!-- Columna izquierda: stats + mascota + cofre -->\n    <div class=\"stack\">\n      <div class=\"frame\">\n        <h2 style=\"color:var(--gold); margin-bottom:10px;\" id=\"kidTitle\">ESTATUS<\u002Fh2>\n\n        <div class=\"row mb-12\" style=\"gap:14px;\">\n          <div class=\"avatar\" id=\"kidAvatar\">🦊<\u002Fdiv>\n          <div style=\"flex:1; min-width:160px;\">\n            <div class=\"ps\" style=\"font-size:10px; color:var(--xp); margin-bottom:4px;\">XP<\u002Fdiv>\n            <div class=\"bar\"><div class=\"bar__fill\" id=\"xpBar\" style=\"width:0%\"><\u002Fdiv><div class=\"bar__txt\" id=\"xpTxt\">0 / 100<\u002Fdiv><\u002Fdiv>\n            <div class=\"muted\" style=\"margin-top:4px; font-size:16px;\" id=\"xpHint\">Próximo nivel en —<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"stats\">\n          <div class=\"stat\"><div class=\"stat__icon\">⚡<\u002Fdiv><div class=\"stat__value ps\" id=\"statLvl\">1<\u002Fdiv><div class=\"stat__label\">NIVEL<\u002Fdiv><\u002Fdiv>\n          <div class=\"stat stat--xp\"><div class=\"stat__icon\">✅<\u002Fdiv><div class=\"stat__value ps\" id=\"statPct\">0%<\u002Fdiv><div class=\"stat__label\">HOY<\u002Fdiv><\u002Fdiv>\n          <div class=\"stat\"><div class=\"stat__icon\"><span class=\"flame\">🔥<\u002Fspan><\u002Fdiv><div class=\"stat__value ps\" id=\"statStreak\">0<\u002Fdiv><div class=\"stat__label\">RACHA<\u002Fdiv><\u002Fdiv>\n          <div class=\"stat stat--mp\"><div class=\"stat__icon\"><span class=\"coin-spin\">🪙<\u002Fspan><\u002Fdiv><div class=\"stat__value ps\" id=\"statCoins\">0<\u002Fdiv><div class=\"stat__label\">MONEDAS<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"frame frame--gold\">\n        <h2 style=\"color:var(--gold); margin-bottom:10px;\">COFRE · SUELDO DEL MES<\u002Fh2>\n        <div class=\"treasure\">\n          <div class=\"treasure__icon\">🪙<\u002Fdiv>\n          <div style=\"flex:1;\">\n            <div class=\"treasure__amount\" id=\"salaryAmt\">$0<\u002Fdiv>\n            <div class=\"treasure__sub\" id=\"salarySub\">— monedas acumuladas · multiplicador —<\u002Fdiv>\n            <div class=\"bar\" style=\"margin-top:6px;\"><div class=\"bar__fill bar__fill--gold\" id=\"salaryBar\" style=\"width:0%\"><\u002Fdiv><div class=\"bar__txt\" id=\"salaryBarTxt\">$0 / $20.000<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"frame\">\n        <h2 style=\"color:var(--purple-2); margin-bottom:10px;\">MASCOTA · DEX<\u002Fh2>\n        <div class=\"pet\">\n          <div class=\"pet__cage\"><canvas class=\"pet__sprite-canvas\" id=\"petSprite\"><\u002Fcanvas><\u002Fdiv>\n          <div class=\"pet__info\">\n            <div>\n              <div class=\"pet__level\" id=\"petLevelTag\">LV.01<\u002Fdiv>\n              <div class=\"pet__name ps\" id=\"petName\">HUEVO<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"pet__desc\" id=\"petDesc\">Suma XP para que tu compañero evolucione.<\u002Fdiv>\n            <div class=\"bar\" style=\"height:14px;\"><div class=\"bar__fill\" id=\"petBar\" style=\"width:0%\"><\u002Fdiv><div class=\"bar__txt\" id=\"petBarTxt\" style=\"font-size:8px;\">0 / 100<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Columna derecha: misiones del día -->\n    <div class=\"stack\">\n      <div class=\"frame\">\n        <div class=\"row row--between mb-12\">\n          <h2 style=\"color:var(--gold);\">MISIONES DEL DÍA<\u002Fh2>\n          <div class=\"muted\" style=\"font-size:16px;\" id=\"dayTypeTag\">—<\u002Fdiv>\n        <\u002Fdiv>\n        <div id=\"quests\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"frame frame--small\">\n        <div class=\"summary\">\n          <div>\n            <div class=\"ps\" style=\"font-size:9px; color:var(--ink-dim);\">RESUMEN DEL DÍA<\u002Fdiv>\n            <div class=\"ps\" style=\"font-size:14px; color:var(--gold); margin-top:6px;\" id=\"summaryPct\">0%<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div class=\"ps\" style=\"font-size:9px; color:var(--ink-dim);\">XP HOY<\u002Fdiv>\n            <div class=\"ps\" style=\"font-size:14px; color:var(--xp); margin-top:6px;\" id=\"summaryXp\">+0<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div class=\"ps\" style=\"font-size:9px; color:var(--ink-dim);\">🪙 HOY<\u002Fdiv>\n            <div class=\"ps\" style=\"font-size:14px; color:var(--gold); margin-top:6px;\" id=\"summaryCoins\">+0<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div class=\"ps\" style=\"font-size:9px; color:var(--ink-dim);\">ESTADO<\u002Fdiv>\n            <div class=\"ps\" style=\"font-size:11px; color:var(--xp); margin-top:6px;\" id=\"summaryState\">EN MARCHA<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Menú inferior tipo pausa -->\n<nav class=\"menubar\">\n  <div class=\"menubar__inner\">\n    <button class=\"btn btn--gold\" data-open=\"shop\">🛒 TIENDA<\u002Fbutton>\n    <button class=\"btn btn--gold\" data-open=\"salary\">💰 SUELDO<\u002Fbutton>\n    <button class=\"btn btn--xp\" data-open=\"bank\">🏦 BANCO<\u002Fbutton>\n    <button class=\"btn btn--mp\" data-open=\"notes\">📜 ANOTAR<\u002Fbutton>\n    <button class=\"btn btn--xp\" data-open=\"history\">📅 HISTORIAL<\u002Fbutton>\n    <button class=\"btn btn--hp\" data-open=\"streaks\">🔥 RACHAS<\u002Fbutton>\n    <button class=\"btn btn--ghost\" data-open=\"admin\">👑 PAPÁS<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<!-- Modales contenedores -->\n<div class=\"scrim\" id=\"scrim\"><div class=\"frame frame--dialog modal\" id=\"modal\"><\u002Fdiv><\u002Fdiv>\n\n<!-- Level up overlay -->\n<div class=\"levelup\" id=\"levelup\">\n  <div class=\"levelup__title\">LEVEL UP!<\u002Fdiv>\n  <canvas class=\"levelup__pet-canvas\" id=\"levelupPet\"><\u002Fcanvas>\n  <div class=\"ps\" style=\"color:var(--white); font-size:14px;\" id=\"levelupSub\">Tu mascota evolucionó<\u002Fdiv>\n  <button class=\"btn btn--gold\" onclick=\"closeLevelUp()\">CONTINUAR ▶<\u002Fbutton>\n<\u002Fdiv>\n\n<div class=\"toasts\" id=\"toasts\"><\u002Fdiv>\n\n<script>\n/* ===============================================================\n   ESTADO Y CONSTANTES\n   =============================================================== */\n\nconst STORAGE_KEY = 'habit_tracker_v1';\n\nconst HABITS = [\n  // group, id, name, sprite, points\n  {id:'h_dientes_am', g:'am', n:'Mano · cara · dientes (mañana)', s:'🪥', p:10},\n  {id:'h_orar',       g:'am', n:'Orar',                            s:'🙏', p:10},\n  {id:'h_desayuno',   g:'am', n:'Preparar su desayuno',            s:'🥣', p:15},\n  {id:'h_mochila',    g:'am', n:'Armar la mochila',                s:'🎒', p:10},\n\n  {id:'h_deberes',    g:'pm', n:'Deberes del colegio',             s:'📚', p:20},\n  {id:'h_instr',      g:'pm', n:'Ensayar instrumento',             s:'🎵', p:20},\n  {id:'h_ejercicio',  g:'pm', n:'Ejercicio o jugar afuera',        s:'⚽', p:15},\n  {id:'h_agua',       g:'pm', n:'Beber 6 vasos de agua',           s:'💧', p:15, water:true},\n  {id:'h_luna',       g:'pm', n:'Cuidar a la gata Luna',           s:'🐈', p:15},\n  {id:'h_familia',    g:'pm', n:'Tiempo familiar o creatividad',   s:'🎨', p:15},\n  {id:'h_casa',       g:'pm', n:'Ayudar con quehaceres del hogar', s:'🧹', p:15},\n\n  {id:'h_banio',      g:'no', n:'Bañarse',                          s:'🛁', p:10},\n  {id:'h_leer',       g:'no', n:'Leer',                             s:'📖', p:15},\n  {id:'h_dientes_pm', g:'no', n:'Mano · cara · dientes (noche)',    s:'😁', p:10},\n  {id:'h_dormir',     g:'no', n:'Acostado a las 08:30 PM',          s:'🌙', p:20},\n];\n\nconst GROUPS = [\n  {id:'am', name:'MAÑANA',   icon:'☀️'},\n  {id:'pm', name:'DURANTE EL DÍA', icon:'🌤️'},\n  {id:'no', name:'NOCHE',    icon:'🌙'},\n];\n\nconst PET_STAGES = [\n  {lv:1,  name:'HUEVO',           sprite:'🥚', desc:'Cuídalo, pronto despertará.'},\n  {lv:2,  name:'POLLUELO',        sprite:'🐣', desc:'¡Salió del cascarón!'},\n  {lv:3,  name:'POLLITO',         sprite:'🐤', desc:'Está aprendiendo a piar.'},\n  {lv:4,  name:'ÁGUILA',          sprite:'🦅', desc:'Vuela alto, valiente.'},\n  {lv:5,  name:'LEÓN',            sprite:'🦁', desc:'Ruge con orgullo.'},\n  {lv:6,  name:'DRAGÓN BEBÉ',     sprite:'🦎', desc:'Aún suelta chispas.'},\n  {lv:7,  name:'UNICORNIO',       sprite:'🦄', desc:'Magia pura.'},\n  {lv:8,  name:'DRAGÓN DE FUEGO', sprite:'🐲', desc:'Su aliento quema el cielo.'},\n  {lv:9,  name:'DRAGÓN ELÉCTRICO',sprite:'⚡',  desc:'Rayos en sus alas.'},\n  {lv:10, name:'DRAGÓN ESTELAR',  sprite:'🌟', desc:'Cruza las estrellas.'},\n];\n\n/* Pixel-art (11x12, cada fila es una \"llave\" de 6 chars que se espeja al centro) */\nfunction rowFromKey(k){ return k + k.slice(0,5).split('').reverse().join(''); }\nconst PET_PIXEL = {\n  1: { palette:{o:'#2b2440',b:'#fff4d6',x:'#ffd700',l:'#ffe9a8'},\n    rows:['...ooo','..obbb','.obbbb','obbbbb','obbbbx','obbbbb','obbbbb','obbbbl','obbbbb','obbbbb','.obbbb','..obbb'] },\n  2: { palette:{o:'#000000',b:'#ffe066',r:'#ff7a30'},\n    rows:['...o..','..obbb','.obbbb','.obobb','obbbbb','obbbbr','obbbbb','.obbbb','..obbb','...obb','....o.','......'] },\n  3: { palette:{o:'#000000',b:'#ffdd55',r:'#ff7a30'},\n    rows:['..o.o.','..obbb','.obbbb','.obobb','obbbbb','obbbbr','obbbbb','.obbbb','..obbb','...obb','....o.','......'] },\n  4: { palette:{o:'#000000',b:'#8a5a34',y:'#ffcf3f'},\n    rows:['....o.','..obbb','.obbbb','.obobb','obbbbb','obbbby','obbbbb','.obbbb','..obbb','...obb','....o.','......'] },\n  5: { palette:{o:'#000000',b:'#f2b84b',m:'#c98a2e',n:'#5c3a21'},\n    rows:['m.m.m.','..obbb','.obbbb','.obobb','obbbbb','obbbbn','obbbbb','.obbbb','..obbb','...obb','....o.','......'] },\n  6: { palette:{o:'#000000',b:'#6fcf6f',h:'#2f7a2f',t:'#ff9f43'},\n    rows:['h.....','..obbb','.obbbb','.obobb','obbbbb','obbbbt','obbbbb','.obbbb','..obbb','...obb','....o.','......'] },\n  7: { palette:{o:'#000000',b:'#f7f4ff',H:'#ffd700',n:'#ff8fd0'},\n    rows:['.....H','..obbb','.obbbb','.obobb','obbbbb','obbbbn','obbbbb','.obbbb','..obbb','...obb','....o.','......'] },\n  8: { palette:{o:'#000000',b:'#e8543e',h:'#4a1f1f',f:'#ff9500'},\n    rows:['h.....','..obbb','.obbbb','.obobb','obbbbb','obbbbf','obbbbb','.obbbb','..obbb','...obb','....o.','......'] },\n  9: { palette:{o:'#000000',b:'#4fa8ff',e:'#fff35c'},\n    rows:['e.....','..obbb','.obbbb','.obobb','obbbbb','obbbbe','obbbbb','.obbbb','..obbb','...obb','....o.','......'] },\n  10:{ palette:{o:'#000000',b:'#9b6bd8',s:'#ffe9a8',v:'#ffd76b'},\n    rows:['.s...s','..obbb','.obbbb','.obobb','obbbbb','obbbbv','obbbbb','.obbbb','..obbb','...obb','....o.','......'] },\n};\nfunction drawPixelPet(canvas, lv){\n  const data = PET_PIXEL[lv] || PET_PIXEL[1];\n  const cell = 9, cols = 11, rows2 = 12;\n  canvas.width = cols*cell; canvas.height = rows2*cell;\n  const ctx = canvas.getContext('2d');\n  ctx.clearRect(0,0,canvas.width,canvas.height);\n  data.rows.map(rowFromKey).forEach((row,y)=>{\n    for(let x=0;x<row.length;x++){\n      const ch = row[x];\n      if(ch==='.') continue;\n      ctx.fillStyle = data.palette[ch] || '#000';\n      ctx.fillRect(x*cell, y*cell, cell, cell);\n    }\n  });\n}\n// XP thresholds (acumulado)\nconst LEVEL_THRESHOLDS = [0, 100, 250, 450, 700, 1000, 1400, 1900, 2500, 3200];\n\nconst SHOP_ITEMS = [\n  {id:'sp_pantalla', name:'30 min extra de pantalla', desc:'Tiempo extra hoy.',     icon:'📺', price: 50},\n  {id:'sp_pelicula', name:'Elegir la película',       desc:'Tú eliges esta noche.', icon:'🎬', price: 80},\n  {id:'sp_postre',   name:'Postre especial',          desc:'Lo que más te gusta.',  icon:'🍰', price:100},\n  {id:'sp_parque',   name:'Salida al parque',          desc:'Aire libre garantizado.', icon:'🌳', price:150},\n  {id:'sp_pijamada', name:'Pijamada con amigo',        desc:'Una noche con alguien.', icon:'🛏️', price:200},\n  {id:'sp_jugp',     name:'Juguete sorpresa pequeño',  desc:'Pequeño pero divertido.', icon:'🎁', price:300},\n  {id:'sp_libre',    name:'Día sin tareas extra',      desc:'Libre por un día.',     icon:'🏖️', price:400},\n  {id:'sp_salida',   name:'Salida especial con papá/mamá', desc:'Tiempo de calidad.', icon:'🚗', price:600},\n  {id:'sp_jugg',     name:'Juguete grande sorpresa',   desc:'¡Premio mayor!',        icon:'🎮', price:1000},\n];\n\nconst BAD_CATALOG = [\n  {id:'b_pelear',  n:'Pelear con hermano',     c:15, s:'⚔️'},\n  {id:'b_desobed', n:'Desobedecer',            c:15, s:'🙅'},\n  {id:'b_mentir',  n:'Mentir',                 c:20, s:'🤥'},\n  {id:'b_malab',   n:'Malas palabras',         c:10, s:'💢'},\n  {id:'b_pataleta',n:'Pataleta',               c:10, s:'😤'},\n  {id:'b_pantalla',n:'Abuso de pantallas',     c:10, s:'📱'},\n  {id:'b_desord',  n:'Desorden',               c: 8, s:'🧦'},\n  {id:'b_comer',   n:'No comer',               c:10, s:'🍽️'},\n  {id:'b_respeto', n:'Faltar al respeto',      c:20, s:'😠'},\n  {id:'b_tareas',  n:'No querer hacer tareas', c:10, s:'📕'},\n];\n\nconst GOOD_CATALOG = [\n  {id:'g_ayudar',  n:'Ayudar sin pedir',     c:15, s:'🤝'},\n  {id:'g_compart', n:'Compartir',            c:15, s:'🎁'},\n  {id:'g_inic',    n:'Iniciativa',           c:12, s:'💡'},\n  {id:'g_honest',  n:'Honestidad',           c:15, s:'⚖️'},\n  {id:'g_logro',   n:'Logro escolar',        c:25, s:'🏅'},\n  {id:'g_amable',  n:'Acto amable',          c:15, s:'💝'},\n  {id:'g_esfuerz', n:'Esfuerzo extra',       c:12, s:'💪'},\n  {id:'g_cuidar',  n:'Cuidar a alguien',     c:15, s:'🫂'},\n  {id:'g_creat',   n:'Creatividad',          c:12, s:'🎨'},\n  {id:'g_paciencia',n:'Paciencia / autocontrol', c:15, s:'🧘'},\n];\n\nconst MONTH_NAMES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];\nconst WEEK_NAMES  = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];\nconst WEEK_SHORT  = ['D','L','M','X','J','V','S'];\n\n/* ===============================================================\n   STATE INIT + LOAD/SAVE\n   =============================================================== */\n\nconst todayStr = () => {\n  const d = new Date();\n  const yyyy = d.getFullYear();\n  const mm = String(d.getMonth()+1).padStart(2,'0');\n  const dd = String(d.getDate()).padStart(2,'0');\n  return `${yyyy}-${mm}-${dd}`;\n};\nconst monthStr = (d=new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;\n\nconst fmtCLP = n => '$' + Math.round(n).toLocaleString('es-CL');\n\nfunction emptyKid(){\n  return {\n    xp:0, coins:0,\n    currentStreak:0, bestStreak:0,\n    lastCompletedDate:null, lastDailyReset:todayStr(),\n    todayHabits:{}, todayWater:0,\n    history:[],\n    claimedStreakBonuses:{},\n    purchases:[],\n    currentMonth: monthStr(),\n    payoutHistory:[],\n    forgiveness:{},\n    annotations:[],\n    ledger:[],\n    missStreak:{}\n  };\n}\n\nfunction freshState(){\n  return {\n    gael: emptyKid(),\n    caleb: emptyKid(),\n    parentPin: '1234',\n    restDays:[0,6],\n    holidays:[],\n    activeKid:'gael',\n  };\n}\n\nfunction migrate(s){\n  // suave: agregar campos faltantes\n  const base = freshState();\n  const out = Object.assign({}, base, s);\n  ['gael','caleb'].forEach(k=>{\n    out[k] = Object.assign({}, emptyKid(), s[k]||{});\n    if(typeof out[k].monthCoins === 'number'){\n      out[k].coins = out[k].monthCoins;\n      delete out[k].monthCoins;\n    }\n  });\n  out.restDays = Array.isArray(out.restDays) ? out.restDays : [0,6];\n  out.holidays = Array.isArray(out.holidays) ? out.holidays : [];\n  out.activeKid = out.activeKid==='caleb' ? 'caleb' : 'gael';\n  return out;\n}\n\nfunction loadState(){\n  try{\n    const raw = localStorage.getItem(STORAGE_KEY);\n    if(!raw) return freshState();\n    return migrate(JSON.parse(raw));\n  }catch(e){\n    console.warn('reset por error en load', e);\n    return freshState();\n  }\n}\nfunction saveState(){\n  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}\n}\nlet state = loadState();\n\n/* ===============================================================\n   HELPERS\n   =============================================================== */\n\nconst KIDS = {\n  gael:  {key:'gael',  name:'Gael',  emoji:'🦊', tone:'#06ffa5'},\n  caleb: {key:'caleb', name:'Caleb', emoji:'🐯', tone:'#ffd700'},\n};\n\nfunction isRestDay(dateStr){\n  const d = new Date(dateStr+'T12:00:00');\n  if(state.holidays.includes(dateStr)) return true;\n  return state.restDays.includes(d.getDay());\n}\n\nfunction petStageFromXp(xp){\n  let lv=1;\n  for(let i=0;i<LEVEL_THRESHOLDS.length;i++){\n    if(xp >= LEVEL_THRESHOLDS[i]) lv = i+1;\n  }\n  return PET_STAGES[Math.min(lv,PET_STAGES.length)-1];\n}\nfunction levelFromXp(xp){ return petStageFromXp(xp).lv; }\nfunction nextLevelInfo(xp){\n  const lv = levelFromXp(xp);\n  if(lv >= LEVEL_THRESHOLDS.length) return {atMax:true, lv};\n  const cur = LEVEL_THRESHOLDS[lv-1];\n  const next= LEVEL_THRESHOLDS[lv];\n  return {atMax:false, lv, into: xp-cur, span: next-cur, remaining: next-xp, next};\n}\n\nfunction calcDailyPct(kid){\n  // Solo cuenta hábitos no perdonados\n  let total=0, done=0;\n  HABITS.forEach(h=>{\n    if(kid.forgiveness && kid.forgiveness[h.id]) return;\n    total++;\n    if(h.water){\n      if((kid.todayWater||0) >= 6) done++;\n    }else{\n      if(kid.todayHabits[h.id]) done++;\n    }\n  });\n  if(total===0) return 100;\n  return Math.round((done/total)*100);\n}\n\nfunction todayPoints(kid){\n  let xp=0, coins=0;\n  HABITS.forEach(h=>{\n    if(kid.forgiveness && kid.forgiveness[h.id]) return;\n    let dn = false;\n    if(h.water){ if((kid.todayWater||0)>=6) dn=true; }\n    else if(kid.todayHabits[h.id]) dn=true;\n    if(dn){ xp += h.p; coins += Math.ceil(h.p/2); }\n  });\n  return {xp, coins};\n}\n\nfunction avgMonthPct(kid){\n  // Promedio de pct de cumplimiento sobre días NO descanso del mes actual\n  const cur = state[kid==='gael'?'gael':'caleb'] || kid;\n  const target = (typeof kid==='string') ? state[kid] : kid;\n  const month = target.currentMonth || monthStr();\n  const items = (target.history||[]).filter(h=>h.date.startsWith(month) && !h.rest);\n  // incluir hoy si no es descanso\n  const today = todayStr();\n  let arr = items.slice();\n  if(!isRestDay(today) && today.startsWith(month)){\n    arr.push({date:today, pct: calcDailyPct(target)});\n  }\n  if(arr.length===0) return 0;\n  return Math.round(arr.reduce((a,b)=>a+(b.pct||0),0)/arr.length);\n}\n\nfunction multiplierFor(pct){\n  if(pct>=90) return {x:1.10, label:'🏆 Excepcional'};\n  if(pct>=75) return {x:1.00, label:'⭐ Muy bueno'};\n  if(pct>=60) return {x:0.95, label:'👍 Bueno'};\n  if(pct>=40) return {x:0.85, label:'😐 Regular'};\n  return {x:0.70, label:'😞 Bajo'};\n}\n\nfunction estimateSalary(target, opts){\n  opts = opts || {};\n  const pct = avgMonthPct(target);\n  const m = multiplierFor(pct);\n  const base = (target.coins||0) * 6;\n  let amount = base * m.x;\n  const hadActivity = (target.coins||0) > 0;\n  if(opts.final && hadActivity) amount = Math.max(5000, amount);\n  amount = Math.min(20000, amount);\n  amount = Math.round(amount/100)*100;\n  return {pct, multiplier:m, base, amount, hadActivity};\n}\n\n/* ---- BANCO: ledger de plata real (CLP) ---- */\nfunction ledgerBalance(kid){\n  return (kid.ledger||[]).reduce((acc,e)=> acc + (e.type==='in' ? e.amount : -e.amount), 0);\n}\nfunction ledgerTotals(kid){\n  let inc=0, exp=0;\n  (kid.ledger||[]).forEach(e=>{ if(e.type==='in') inc+=e.amount; else exp+=e.amount; });\n  return {inc, exp, bal: inc-exp};\n}\nfunction addLedgerEntry(k, type, amount, concept, opts){\n  const kid = state[k];\n  kid.ledger = kid.ledger || [];\n  kid.ledger.push(Object.assign({\n    id: 'lg_'+Date.now()+'_'+Math.floor(Math.random()*999),\n    type, amount: Math.abs(Math.round(amount)),\n    concept: concept || (type==='in'?'Ingreso':'Egreso'),\n    date: todayStr(), auto:false\n  }, opts||{}));\n  saveState();\n}\n\n/* ===============================================================\n   DAILY RESET + MONTH ROLLOVER\n   =============================================================== */\n\nfunction ensureDailyReset(){\n  const t = todayStr();\n  ['gael','caleb'].forEach(k=>{\n    const kid = state[k];\n    if(!kid.lastDailyReset) kid.lastDailyReset = t;\n    if(kid.lastDailyReset === t) return;\n\n    // Archivar día(s) intermedio(s) — al menos el último\n    const last = kid.lastDailyReset;\n    const lastDate = new Date(last+'T12:00:00');\n\n    const pct = calcDailyPct(kid);\n    const rest = isRestDay(last);\n    const pts = todayPoints(kid);\n\n    // historial\n    kid.history.push({\n      date:last, pct, rest,\n      xp:pts.xp, coins:pts.coins,\n      habits: Object.assign({}, kid.todayHabits),\n      water: kid.todayWater||0,\n      forgiveness: Object.assign({}, kid.forgiveness||{}),\n    });\n\n    // racha\n    if(!rest){\n      if(pct >= 80){\n        kid.currentStreak += 1;\n        if(kid.currentStreak > kid.bestStreak) kid.bestStreak = kid.currentStreak;\n        // bonus\n        const bonuses = {3:20,7:50,14:120,30:300};\n        if(bonuses[kid.currentStreak] && !kid.claimedStreakBonuses[kid.currentStreak]){\n          kid.coins += bonuses[kid.currentStreak];\n          kid.claimedStreakBonuses[kid.currentStreak] = true;\n        }\n      }else if(pct < 50){\n        kid.currentStreak = 0;\n        kid.coins = Math.max(0, kid.coins - 20);\n        kid.claimedStreakBonuses = {};\n      }\n    }\n\n    // miss streak por hábito + penalización\n    HABITS.forEach(h=>{\n      if(rest){ return; }\n      if(kid.forgiveness && kid.forgiveness[h.id]) return;\n      let done = false;\n      if(h.water) done = (kid.todayWater||0)>=6;\n      else done = !!kid.todayHabits[h.id];\n      if(done){ kid.missStreak[h.id] = 0; }\n      else{\n        kid.missStreak[h.id] = (kid.missStreak[h.id]||0) + 1;\n        if(kid.missStreak[h.id] >= 2){\n          kid.coins = Math.max(0, kid.coins - 5);\n        }\n      }\n    });\n\n    // Limpiar día\n    kid.todayHabits = {};\n    kid.todayWater = 0;\n    kid.forgiveness = {};\n    kid.lastDailyReset = t;\n\n    // ¿Cambio de mes?\n    const curMonth = monthStr(new Date(t+'T12:00:00'));\n    if(kid.currentMonth !== curMonth){\n      // cerrar mes anterior\n      const est = estimateSalary(kid, {final:true});\n      if(est.hadActivity){\n        kid.payoutHistory.push({\n          month: kid.currentMonth,\n          amount: est.amount,\n          multiplier: est.multiplier.x,\n          label: est.multiplier.label,\n          pct: est.pct,\n          coins: kid.coins,\n          status: 'pendiente',\n          createdAt: t\n        });\n      }\n      kid.coins = 0;\n      kid.currentMonth = curMonth;\n    }\n  });\n  saveState();\n}\n\nensureDailyReset();\n\n/* ===============================================================\n   ACCIONES\n   =============================================================== */\n\nfunction getKid(){ return state[state.activeKid]; }\n\nfunction toggleHabit(hid){\n  const kid = getKid();\n  if(kid.forgiveness && kid.forgiveness[hid]) return; // no toggle si perdonado\n  const h = HABITS.find(x=>x.id===hid);\n  const was = !!kid.todayHabits[hid];\n  if(was){\n    kid.todayHabits[hid] = false;\n  }else{\n    kid.todayHabits[hid] = true;\n    awardForHabit(kid, h);\n    spawnXpToast(`+${h.p} XP`,'#06ffa5');\n    spawnXpToast(`+${Math.ceil(h.p/2)} 🪙`,'#ffd700', 16);\n    confettiBurst(8);\n    checkPerfectDay(kid);\n    checkLevelUp(kid);\n  }\n  saveState(); renderAll();\n}\n\nfunction awardForHabit(kid, h){\n  const xp = h.p;\n  const coins = Math.ceil(h.p/2);\n  kid.xp += xp;\n  kid.coins += coins;\n}\n\nfunction tapWater(){\n  const kid = getKid();\n  const h = HABITS.find(x=>x.water);\n  if(kid.forgiveness[h.id]) return;\n  const prev = kid.todayWater||0;\n  if(prev >= 6){\n    // reset (long-press style: tap when full resets)\n    kid.todayWater = 0;\n    kid.todayHabits[h.id] = false;\n  }else{\n    kid.todayWater = prev+1;\n    if(kid.todayWater === 6){\n      kid.todayHabits[h.id] = true;\n      awardForHabit(kid, h);\n      spawnXpToast(`+${h.p} XP`,'#06ffa5');\n      spawnXpToast(`+${Math.ceil(h.p/2)} 🪙`,'#ffd700', 16);\n      confettiBurst(10);\n      checkPerfectDay(kid);\n      checkLevelUp(kid);\n    }\n  }\n  saveState(); renderAll();\n}\n\nfunction forgiveHabit(hid){\n  const kid = getKid();\n  kid.forgiveness = kid.forgiveness||{};\n  if(kid.forgiveness[hid]){\n    delete kid.forgiveness[hid];\n  }else{\n    kid.forgiveness[hid] = true;\n    // si ya estaba marcado, lo desmarca (no debe sumar dos veces)\n    if(kid.todayHabits[hid]){\n      // restar\n      const h = HABITS.find(x=>x.id===hid);\n      kid.xp = Math.max(0, kid.xp - h.p);\n      const c = Math.ceil(h.p/2);\n      kid.coins = Math.max(0, kid.coins - c);\n      kid.todayHabits[hid] = false;\n    }\n    const h = HABITS.find(x=>x.id===hid);\n    if(h.water){ kid.todayWater = 0; }\n  }\n  saveState(); renderAll();\n}\n\nfunction checkPerfectDay(kid){\n  // todos los hábitos no perdonados completos + agua llena\n  let total=0, done=0;\n  HABITS.forEach(h=>{\n    if(kid.forgiveness[h.id]) return;\n    total++;\n    if(h.water){ if((kid.todayWater||0)>=6) done++;}\n    else if(kid.todayHabits[h.id]) done++;\n  });\n  if(total>0 && done===total && !kid._perfectAwarded){\n    kid._perfectAwarded = true;\n    kid.xp += 50; kid.coins += 30;\n    spawnXpToast('+50 XP DÍA PERFECTO','#ffd700',-20);\n    spawnXpToast('+30 🪙','#ffd700', 14);\n    confettiBurst(40);\n  }else if(done < total){\n    kid._perfectAwarded = false;\n  }\n}\n\nfunction checkLevelUp(kid){\n  const stage = petStageFromXp(kid.xp);\n  if(!kid._lastStageLv) kid._lastStageLv = 1;\n  if(stage.lv > kid._lastStageLv){\n    kid._lastStageLv = stage.lv;\n    showLevelUp(stage);\n  }else if(!kid._lastStageLv){\n    kid._lastStageLv = stage.lv;\n  }\n}\n// inicializar marker\n['gael','caleb'].forEach(k=>{ state[k]._lastStageLv = levelFromXp(state[k].xp); });\n\n/* ===============================================================\n   TOASTS / CONFETTI / LEVEL UP\n   =============================================================== */\nfunction spawnXpToast(text, color, dy=0){\n  const t = document.getElementById('toasts');\n  const el = document.createElement('div');\n  el.className='xp-toast';\n  el.textContent = text;\n  el.style.color = color;\n  el.style.left = (window.innerWidth/2 - 40) + 'px';\n  el.style.top  = (window.innerHeight/2 + dy) + 'px';\n  t.appendChild(el);\n  setTimeout(()=>el.remove(), 1400);\n}\nfunction confettiBurst(n=20){\n  const t = document.getElementById('toasts');\n  const cx = window.innerWidth/2;\n  const cy = window.innerHeight/2;\n  const colors = ['#ffd700','#06ffa5','#4361ee','#e63946','#b56cf0','#ff5d8f','#ffffff'];\n  for(let i=0;i<n;i++){\n    const el = document.createElement('div');\n    el.className='confetti';\n    el.style.background = colors[i%colors.length];\n    el.style.left = cx + 'px';\n    el.style.top  = cy + 'px';\n    const a = Math.random()*Math.PI*2;\n    const r = 80 + Math.random()*180;\n    el.style.setProperty('--dx', Math.cos(a)*r + 'px');\n    el.style.setProperty('--dy', (Math.sin(a)*r - 40) + 'px');\n    t.appendChild(el);\n    setTimeout(()=>el.remove(), 1600);\n  }\n}\nfunction showLevelUp(stage){\n  const lv = document.getElementById('levelup');\n  drawPixelPet(document.getElementById('levelupPet'), stage.lv);\n  document.getElementById('levelupSub').textContent = `Lv.${String(stage.lv).padStart(2,'0')} · ${stage.name}`;\n  lv.classList.add('is-open');\n  confettiBurst(60);\n}\nfunction closeLevelUp(){ document.getElementById('levelup').classList.remove('is-open'); }\n\n/* ===============================================================\n   RENDER PRINCIPAL\n   =============================================================== */\nfunction renderAll(){\n  renderTopbar();\n  renderParty();\n  renderKidPanel();\n  renderQuests();\n  renderSummary();\n}\n\nfunction renderTopbar(){\n  const d = new Date();\n  const wd = WEEK_NAMES[d.getDay()];\n  const day = d.getDate();\n  const mo = MONTH_NAMES[d.getMonth()];\n  const yr = d.getFullYear();\n  const tag = isRestDay(todayStr()) ? '<strong>DESCANSO<\u002Fstrong>' : '<strong>DÍA ACTIVO<\u002Fstrong>';\n  document.getElementById('topbarDate').innerHTML = `${wd.toUpperCase()} ${String(day).padStart(2,'0')} ${mo.toUpperCase()} ${yr}<br>${tag}`;\n}\n\nfunction renderParty(){\n  const el = document.getElementById('party');\n  const items = [\n    {key:'gael',  name:'GAEL',  role:'🦊 Zorro',   avatar:'🦊'},\n    {key:'caleb', name:'CALEB', role:'🐯 Tigre',   avatar:'🐯'},\n    {key:'parents', name:'PAPÁS', role:'👑 Modo Admin', avatar:'👑'},\n  ];\n  el.innerHTML = items.map(it=>{\n    const isAct = (it.key==='parents') ? false : (state.activeKid===it.key);\n    return `<button class=\"party__btn ${isAct?'is-active':''}\" data-party=\"${it.key}\">\n      <div class=\"avatar\">${it.avatar}<\u002Fdiv>\n      <div>\n        <div class=\"party__name\">${it.name}<\u002Fdiv>\n        <div class=\"party__role\">${it.role}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fbutton>`;\n  }).join('');\n  el.querySelectorAll('[data-party]').forEach(b=>{\n    b.addEventListener('click',()=>{\n      const k = b.dataset.party;\n      if(k==='parents'){ openModal('admin'); return; }\n      state.activeKid = k;\n      saveState(); renderAll();\n    });\n  });\n}\n\nfunction renderKidPanel(){\n  const kid = getKid();\n  const meta = KIDS[state.activeKid];\n  document.getElementById('kidTitle').textContent = `ESTATUS · ${meta.name.toUpperCase()}`;\n  document.getElementById('kidAvatar').textContent = meta.emoji;\n\n  // XP bar\n  const ni = nextLevelInfo(kid.xp);\n  const pct = ni.atMax ? 100 : Math.floor((ni.into/ni.span)*100);\n  document.getElementById('xpBar').style.width = pct+'%';\n  document.getElementById('xpTxt').textContent = ni.atMax\n    ? `${kid.xp} XP · MAX`\n    : `${ni.into} / ${ni.span}`;\n  document.getElementById('xpHint').textContent = ni.atMax\n    ? 'Nivel máximo alcanzado.'\n    : `${ni.remaining} XP para Lv.${ni.lv+1}`;\n\n  // Stats\n  document.getElementById('statLvl').textContent = String(levelFromXp(kid.xp)).padStart(2,'0');\n  document.getElementById('statPct').textContent = calcDailyPct(kid) + '%';\n  document.getElementById('statStreak').textContent = kid.currentStreak;\n  document.getElementById('statCoins').textContent = kid.coins;\n\n  // Pet\n  const stage = petStageFromXp(kid.xp);\n  drawPixelPet(document.getElementById('petSprite'), stage.lv);\n  document.getElementById('petName').textContent = stage.name;\n  document.getElementById('petLevelTag').textContent = `LV.${String(stage.lv).padStart(2,'0')}`;\n  document.getElementById('petDesc').textContent = stage.desc;\n  document.getElementById('petBar').style.width = pct + '%';\n  document.getElementById('petBarTxt').textContent = ni.atMax ? 'MAX' : `${ni.into}/${ni.span}`;\n\n  // Salary\n  const est = estimateSalary(kid);\n  document.getElementById('salaryAmt').textContent = fmtCLP(est.amount);\n  document.getElementById('salarySub').textContent =\n    `${kid.coins||0} 🪙 este mes · ${est.multiplier.label} (×${est.multiplier.x.toFixed(2)}) · ${est.pct}% · mín. garantizado $5.000 al cierre`;\n  const sp = Math.min(100, Math.round((e
